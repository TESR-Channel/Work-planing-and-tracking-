<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TESR Board</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TESR Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
/* ===== TESR CI: Black · Gold · Red ===== */
:root,[data-theme=dark]{
  --yel:#facc15;--yelbg:rgba(250,204,21,.16);--bg:#0b0b0d;--bg2:#141417;--card:#1c1c21;--card2:#27262c;--line:#34302a;
  --tx:#f1ede4;--mut:#a39d8f;--gold:#d4a72c;--gold2:#f0c552;--red:#d71f33;--red2:#ff3b4f;
  --ok:#2fbf71;--warn:#e7a218;--late:#ff4d5e;--shadow:0 4px 18px rgba(0,0,0,.45);
  --glow:radial-gradient(1200px 600px at 50% -10%,rgba(212,167,44,.12),transparent 60%);
  color-scheme:dark;
}
[data-theme=light]{
  --yel:#a37800;--yelbg:rgba(234,179,8,.18);--bg:#f5f2ea;--bg2:#fffdf8;--card:#ffffff;--card2:#f1ecdf;--line:#e3dac4;
  --tx:#1b1a17;--mut:#6f6858;--gold:#b8891a;--gold2:#8f6a0f;--red:#c8102e;--red2:#e0213f;
  --ok:#1f9d5a;--warn:#b7790a;--late:#d42a3c;--shadow:0 3px 14px rgba(60,45,10,.10);
  --glow:radial-gradient(1200px 600px at 50% -10%,rgba(184,137,26,.14),transparent 60%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg) var(--glow) no-repeat;color:var(--tx);font:14px/1.5 "Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--gold)}
button.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:#16130b;font-weight:700}
[data-theme=dark] button.pri{background:linear-gradient(180deg,#f0c552,#c99a22)}
button.pri:hover{filter:brightness(1.08)}
button.danger{background:transparent;border-color:var(--late);color:var(--late)}
button.icon{background:transparent;border:none;padding:4px 6px;color:var(--mut)}
button.icon:hover{color:var(--tx)}
button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,167,44,.15)}
textarea{width:100%;resize:vertical}
.muted{color:var(--mut);font-size:12px}
.hidden{display:none!important}
.kanit{font-family:"Noto Sans Thai",sans-serif}

/* ===== header (always black-gold, both themes) ===== */
.top{--tx:#f1ede4;--mut:#a39d8f;--bg2:#17171b;--card2:#232228;--line:#3a352a;
  color:var(--tx);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;
  background:linear-gradient(90deg,#000 0%,#121214 55%,#1a1408 100%);border-bottom:2px solid var(--gold);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:linear-gradient(90deg,transparent,var(--red) 30%,var(--red) 70%,transparent);opacity:.8}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px}
.brand img{height:38px;filter:drop-shadow(0 2px 6px rgba(212,167,44,.35))}
.brand .t{font-family:sans-serif;font-weight:700;font-size:19px;letter-spacing:.6px;line-height:1}
.brand .t b{color:#f0c552}
.brand .t small{display:block;font:500 10px "Noto Sans Thai";letter-spacing:1.5px;color:#a39d8f;margin-top:3px}
.tabs{display:flex;gap:4px;background:#17171b;padding:3px;border-radius:10px;border:1px solid #3a352a}
.tabs button{border:none;background:transparent;padding:5px 12px;color:#f1ede4}
.tabs button.on{background:var(--red);color:#fff;font-weight:600;box-shadow:0 0 0 1px rgba(240,197,82,.35) inset}
.spacer{flex:1}
.mode{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.mode.sb{color:#2fbf71;border-color:#2fbf71}
.mode.lc{color:#e7a218;border-color:#e7a218}
#search{width:160px}
.who{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 3px;border:1px solid #3a352a;border-radius:20px;font-size:13px;cursor:pointer;background:#17171b}
.who .r{font-size:10px;color:#f0c552;border:1px solid #6b5520;border-radius:10px;padding:0 6px}
main{flex:1;overflow:auto;min-height:0}

/* ===== login ===== */
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:80;
  background:var(--bg) radial-gradient(900px 500px at 50% 0%,rgba(212,167,44,.18),transparent 65%)}
.lbox{width:min(400px,100%);background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow);text-align:center}
.lbox img{width:132px;filter:drop-shadow(0 6px 18px rgba(212,167,44,.35))}
.lbox h1{font-family:sans-serif;margin:10px 0 2px;font-size:26px;letter-spacing:.5px}
.lbox h1 b{color:var(--gold)}
.lbox .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.lbox label{display:block;text-align:left;font-size:12px;color:var(--mut);margin:10px 0 4px}
.lbox input{width:100%;padding:10px 12px}
.lbox button.pri{width:100%;padding:11px;margin-top:16px;font-size:15px}
.lerr{color:var(--late);font-size:13px;min-height:20px;margin-top:8px}
.redline{height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:14px 30px}
.ltheme{position:absolute;top:14px;right:14px}

/* ===== board ===== */
.board{display:flex;align-items:flex-start;gap:12px;padding:16px 14px;min-height:100%;overflow-x:auto}
.list{flex:0 0 290px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 116px);box-shadow:var(--shadow)}
.lhead{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;cursor:grab;border-bottom:1px solid var(--line)}
.lname{font-weight:600;flex:1;font-family:sans-serif;font-weight:500;letter-spacing:.3px}
.lhead::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gold)}
.list.done .lhead::before{background:var(--ok)}
.cnt{font-size:12px;color:var(--mut);background:var(--card2);border-radius:20px;padding:0 8px}
.donetag{font-size:11px;color:var(--ok)}
.cards{padding:8px;overflow-y:auto;min-height:36px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer;user-select:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--gold);transform:translateY(-1px)}
.card.d-ok{border-left-color:var(--ok)}
.card.d-soon{border-left-color:var(--yel)}
.card.d-late{border-left-color:var(--late)}
.card.d-done{border-left-color:var(--line)}
.card.d-none{border-left-color:var(--warn);border-left-style:dashed}
.card.note{border-left-color:#3b82f6}
.kind{font-size:11px;color:#3b82f6;font-weight:600;margin-bottom:3px}
.card.isdone .ctitle{color:var(--mut);text-decoration:line-through}
.card.mine{box-shadow:0 0 0 1px rgba(212,167,44,.35) inset}
.ctitle{font-weight:500;word-break:break-word}
.labels{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.lb{font-size:11px;padding:1px 8px;border-radius:20px;color:#fff;font-weight:500}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px}
.badge{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--card2);color:var(--mut)}
.badge.ok{background:rgba(47,191,113,.16);color:var(--ok);font-weight:600}
.badge.late{background:rgba(255,77,94,.16);color:var(--late);font-weight:600}
.badge.soon{background:var(--yelbg);color:var(--yel);font-weight:600}
.badge.done{color:var(--mut)}
.badge.none{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.badge.pr-urgent{background:var(--red);color:#fff}
.badge.pr-high{color:#f97316}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.seg{display:flex;gap:4px;background:var(--card2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.seg button{flex:1;border:none;background:transparent;padding:8px}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#16130b;font-weight:700}
[data-theme=dark] .seg button.on{background:linear-gradient(180deg,#f0c552,#c99a22)}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);margin:12px 0}
label.fl input{font-size:15px;padding:9px 11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin:-4px 0 12px}
.phead{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.phead .nm{font-family:sans-serif;font-size:18px;font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card)}
.mtop .nm.link{cursor:pointer}.mtop .nm.link:hover{color:var(--gold)}
.avs{margin-left:auto;display:flex}
.av{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--card);margin-left:-6px;flex:none}
.av.lg{width:40px;height:40px;font-size:14px;margin:0;border-color:var(--gold)}
.addcard{margin:0 8px 8px;background:transparent;border:1px dashed var(--line);color:var(--mut)}
.addlist{flex:0 0 220px}
.addlist button{width:100%;padding:12px;background:transparent;border:1px dashed var(--line);color:var(--mut)}
.ghost{opacity:.35}
.chosen{transform:rotate(2deg)}

/* ===== modal ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:50}
.sheet{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;width:min(760px,100%);padding:18px;box-shadow:var(--shadow)}
.mhead{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.mtitle{flex:1;font-size:18px;font-weight:600;background:transparent;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:13px;color:var(--gold2);display:flex;align-items:center;gap:8px;font-family:sans-serif;font-weight:500;letter-spacing:.3px}
[data-theme=dark] .sec h4{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px 3px 4px;font-size:13px}
.chip .av{margin:0;border:none;width:22px;height:22px}
.chip.on{background:rgba(212,167,44,.16);border-color:var(--gold);color:var(--gold2)}
[data-theme=dark] .chip.on{color:var(--gold2)}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.row input{flex:1;min-width:120px}
.ck{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.ckhead{display:flex;align-items:center;gap:8px}
.ckhead b{flex:1}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.ckitem{display:flex;align-items:center;gap:8px;padding:3px 0}
.ckitem span{flex:1;word-break:break-word}
.ckitem select{padding:2px 4px;font-size:12px;max-width:120px}
.ckitem input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold)}
.strike{text-decoration:line-through;color:var(--mut)}
.att{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.att a{flex:1;color:var(--gold2);text-decoration:none;word-break:break-all}
[data-theme=dark] .att a{color:var(--gold2)}
.att img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.upl{display:inline-block;margin-top:4px;padding:6px 12px;border:1px dashed var(--gold);border-radius:8px;color:var(--gold);cursor:pointer}
.cmt{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.cmt .av{margin:0}
.act{font-size:12px;color:var(--mut);padding:2px 0}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}

/* ===== team & dashboard ===== */
.wrap{padding:16px;max-width:1300px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar h2{margin:0;font-size:20px;flex:1;font-family:sans-serif;font-weight:600}
.toolbar h2 small{font:400 12px "Noto Sans Thai";color:var(--mut);margin-left:6px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.mcard.me{border-color:var(--gold)}
.mtop{display:flex;align-items:center;gap:10px}
.mtop .nm{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.stat b{display:block;font-size:18px;font-family:sans-serif}
.stat span{font-size:11px;color:var(--mut)}
.stat.red b{color:var(--late)}
.stat.gold b{color:var(--gold)}
.stat.green b{color:var(--ok)}
.mini{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:13px}
.mini:hover{border-color:var(--gold)}
.mini .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;padding:0 7px;border-radius:20px;background:var(--card2);color:var(--mut);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:3px solid var(--gold);box-shadow:var(--shadow)}
.kpi.r{border-top-color:var(--red)}
.kpi.g{border-top-color:var(--ok)}
.kpi.y{border-top-color:var(--yel)}
.kpi.y b{color:var(--yel)}
.kpi.r b{color:var(--late)}
.kpi b{display:block;font-size:28px;line-height:1.2;font-family:sans-serif;font-weight:600}
.kpi span{font-size:12px;color:var(--mut)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chartbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;height:300px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.chartbox h3{margin:0 0 8px;font-size:13px;color:var(--gold);font-family:sans-serif;font-weight:500}
.chartbox .cv{flex:1;position:relative;min-height:0}
table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{color:var(--gold);font-weight:600;background:var(--card)}
.tblwrap{overflow-x:auto}

/* ===== settings ===== */
.mem{display:grid;grid-template-columns:28px 1.4fr 1fr 1fr 110px 74px 44px 30px;gap:6px;align-items:center;margin-bottom:6px}
.mem input[type=color]{padding:0;height:30px;width:44px}
.mem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem .nm small{display:block;color:var(--mut);font-size:11px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);padding:8px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}


/* ================= FUTURE HUD THEME · Robot × Space × Electronics ================= */
:root,[data-theme=dark]{
  --glass:rgba(14,12,16,.72);--glass2:rgba(26,22,28,.78);--edge:rgba(212,167,44,.28);--neon:0 0 18px rgba(240,197,82,.28);
  --veil:linear-gradient(180deg,rgba(5,5,8,.80),rgba(12,3,6,.74) 55%,rgba(5,5,8,.90));
  --grid:rgba(240,197,82,.05);
}
[data-theme=light]{
  --glass:rgba(255,252,246,.86);--glass2:rgba(255,255,255,.92);--edge:rgba(184,137,26,.35);--neon:0 0 14px rgba(184,137,26,.18);
  --veil:linear-gradient(180deg,rgba(248,244,236,.90),rgba(250,240,236,.86) 55%,rgba(248,244,236,.93));
  --grid:rgba(184,137,26,.07);
}
body{background:
  repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 44px),
  repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 44px),
  var(--veil),url(bg.jpg) center/cover no-repeat fixed,#07070a}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.orb,.brand .t,.kpi b,.stat b,.lbox h1,.toolbar h2{font-family:Orbitron,"Noto Sans Thai",sans-serif}
.brand .t{letter-spacing:2px;font-weight:800;font-size:18px}
.brand .t small{font-family:Orbitron,sans-serif;letter-spacing:3px;font-size:9px;color:#c9a34a}

/* header: glass + animated neon rail */
.top{background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(16,10,12,.78) 55%,rgba(40,26,6,.72));backdrop-filter:blur(12px) saturate(1.3);border-bottom:1px solid rgba(240,197,82,.55);z-index:30}
.top::after{height:2px;bottom:-3px;opacity:1;background:linear-gradient(90deg,transparent,var(--red),#f0c552,var(--red),transparent);background-size:200% 100%;animation:rail 6s linear infinite;box-shadow:0 0 12px rgba(215,31,51,.7)}
@keyframes rail{from{background-position:200% 0}to{background-position:-200% 0}}
.tabs{background:rgba(0,0,0,.45)}
.tabs button.on{background:linear-gradient(180deg,#ff3b4f,#b3121f);box-shadow:0 0 14px rgba(255,59,79,.55),0 0 0 1px rgba(240,197,82,.5) inset}

/* HUD panels: glass + gold corner brackets */
.list,.kpi,.chartbox,.mcard,.sheet,.lbox,.phead,table{
  background:
    linear-gradient(var(--gold),var(--gold)) left top/16px 2px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left top/2px 16px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom/16px 2px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom/2px 16px no-repeat,
    var(--glass);
  backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
  border:1px solid var(--edge);border-radius:4px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
}
.kpi{border-top:1px solid var(--edge)}
.kpi::before{content:"";display:block;height:3px;margin:-12px -14px 10px;background:linear-gradient(90deg,var(--gold),transparent)}
.kpi.g::before{background:linear-gradient(90deg,var(--ok),transparent)}
.kpi.y::before{background:linear-gradient(90deg,var(--yel),transparent)}
.kpi.r::before{background:linear-gradient(90deg,var(--late),transparent)}
.kpi b{font-weight:700;font-size:30px;text-shadow:var(--neon)}
.kpi.g b{color:var(--ok);text-shadow:0 0 14px rgba(47,191,113,.35)}
.kpi.y b{text-shadow:0 0 14px rgba(250,204,21,.35)}
.kpi.r b{text-shadow:0 0 14px rgba(255,77,94,.4)}
.lhead{border-bottom:1px dashed var(--edge)}
.lname{font-family:Orbitron,sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
.lhead::before{box-shadow:0 0 10px var(--gold)}
.list.done .lhead::before{box-shadow:0 0 10px var(--ok)}
.cnt{font-family:Orbitron,sans-serif;font-size:11px}

/* cards */
.card{background:var(--glass2);border-radius:6px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(240,197,82,.10) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s}
.card:hover{border-color:var(--gold);box-shadow:var(--neon),0 6px 18px rgba(0,0,0,.35)}
.card:hover::after{transform:translateX(100%)}
.card.d-late{box-shadow:inset 3px 0 12px -6px var(--late)}
.card.d-soon{box-shadow:inset 3px 0 12px -6px var(--yel)}
.badge.late{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 10px rgba(255,77,94,.55)}}
.addcard,.addlist button{border-style:dashed;border-color:var(--edge);background:rgba(0,0,0,.12)}
.addcard:hover,.addlist button:hover{color:var(--gold);box-shadow:var(--neon)}
.av{box-shadow:0 0 0 1px rgba(240,197,82,.4)}

/* modal */
.modal{background:rgba(3,3,6,.72);backdrop-filter:blur(4px)}
.sheet{border-top:1px solid var(--edge)}
.sheet::before{content:"";display:block;height:2px;margin:-18px -18px 16px;background:linear-gradient(90deg,var(--red),var(--gold),transparent)}
.ck,.att,.mini,.stat{background:var(--glass2)}

/* team / dash */
.mcard.me{box-shadow:var(--neon)}
.toolbar h2{letter-spacing:1px;font-weight:700;font-size:19px;text-shadow:var(--neon)}
th{font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:1px;background:rgba(0,0,0,.25)}
[data-theme=light] th{background:rgba(184,137,26,.08)}
.phead .nm{font-family:Orbitron,sans-serif;letter-spacing:.5px}

/* login: space console */
.login{background:var(--veil),url(bg.jpg) center/cover no-repeat,#07070a}
.lbox{padding:30px 26px 24px}
.lbox h1{font-weight:800;letter-spacing:3px;font-size:26px}
.lbox h1 b{text-shadow:0 0 16px rgba(240,197,82,.55)}
.orbwrap{position:relative;width:170px;height:170px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center}
.orbwrap::before,.orbwrap::after{content:"";position:absolute;inset:0;border-radius:50%}
.orbwrap::before{border:1px dashed rgba(240,197,82,.55);animation:spin 18s linear infinite}
.orbwrap::after{inset:10px;border:2px solid transparent;border-top-color:var(--red);border-bottom-color:#f0c552;animation:spin 4s linear infinite reverse;filter:drop-shadow(0 0 6px rgba(215,31,51,.7))}
.orbwrap img{width:118px!important;position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.lbox .sub{letter-spacing:.3px}
.lbox input{background:rgba(0,0,0,.25)}
[data-theme=light] .lbox input{background:#fff}
.boot{font:500 10px Orbitron,monospace;letter-spacing:2px;color:var(--mut);margin-top:10px;opacity:.8}
.boot i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:6px;animation:pulse2 1.4s infinite}
@keyframes pulse2{50%{opacity:.3}}

/* ===== Trello-style card modal ===== */
.sheet.wide{width:min(1120px,100%)}
.cover{height:170px;margin:-16px -18px 14px;background:#fff;border-bottom:1px solid var(--edge);display:flex;justify-content:center}.cover img{height:100%;max-width:100%;object-fit:contain}
.ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.ring.on{border-color:var(--ok);background:var(--ok);color:#fff;box-shadow:0 0 10px var(--ok)}
.mmeta{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px 30px}
.prog{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.prog .bar{flex:1;margin:0}.prog .bar.big{height:9px}
.prog b{font-family:Orbitron,sans-serif;color:var(--gold);min-width:48px;text-align:right}
.prog.sm{margin:4px 0 6px}.prog.sm .muted{min-width:34px}
.cgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
.cright{border-left:1px dashed var(--edge);padding-left:18px;max-height:72vh;overflow:auto}
.fh{position:sticky;top:0;background:var(--glass);backdrop-filter:blur(8px);padding:4px 0;z-index:1;justify-content:space-between}
.cbox{display:flex;gap:8px;align-items:flex-start}.cbox textarea{flex:1}
.feed{margin-top:8px}
.fi{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line)}
.fi .av{margin:0;flex:none}.fb{flex:1;min-width:0}
.fi.act .fb{font-size:13px}.fi.act .fb>div{color:var(--tx)}
.bub{background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.bub a{color:var(--gold2)}.mention{color:var(--gold)}
.fa{margin-top:3px}.lnk{background:none;border:none;padding:0;color:var(--mut);font-size:12px;text-decoration:underline;cursor:pointer}.lnk:hover{color:var(--gold)}
.files{display:grid;gap:8px}
.file{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--glass2)}
.file img,.file .ph{width:78px;height:52px;object-fit:cover;border-radius:5px;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center;font:700 11px Orbitron,sans-serif;color:var(--mut)}
.file .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.file .nm a{color:var(--tx);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .nm a:hover{color:var(--gold)}
a.icon{text-decoration:none}
.upl.sm{padding:1px 10px;font-size:12px;margin:0}
.itdue{padding:2px 4px;font-size:12px;width:128px}
.itdue.late{border-color:var(--late);color:var(--late)}.itdue.soon{border-color:var(--yel);color:var(--yel)}.itdue.ok{border-color:var(--ok);color:var(--ok)}.itdue.done{opacity:.55}
.ccover{height:110px;margin:-10px -12px 8px;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}.ccover img{width:100%;height:100%;object-fit:cover;display:block}
.cprog{display:flex;align-items:center;gap:8px;margin-top:8px}
.cbar{flex:1;height:5px;background:var(--card2);border-radius:5px;overflow:hidden}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:5px;box-shadow:0 0 8px rgba(240,197,82,.4)}
.cprog span{font:600 10px Orbitron,sans-serif;color:var(--mut);min-width:30px;text-align:right}
.rng{display:inline-flex;align-items:center;gap:4px}.rng input{padding:5px 6px}
@media (max-width:820px){.cgrid{grid-template-columns:1fr}.cright{border-left:none;padding-left:0;border-top:1px dashed var(--edge);padding-top:10px;max-height:none}.ckitem{flex-wrap:wrap}.itdue{width:118px}}

/* ===== Typography polish (Trello-like clean) ===== */

.chartbox h3{font-size:13px;font-weight:600}

.ctitle{font-size:14px;font-weight:500;line-height:1.45}
.card{padding:10px 12px}

.badge{font-size:11.5px;padding:2px 7px;border-radius:4px}

.mtitle{font-size:20px;font-weight:700}
.kpi span,.stat span{font-size:12px}
.brand .t{font-family:Orbitron,sans-serif}
.kpi b,.stat b,.prog b,.cprog span{font-family:Orbitron,Inter,sans-serif}
.lbox h1{font-family:Orbitron,sans-serif}

.howto{display:inline-block;margin-top:12px;font-size:13px;color:var(--gold);text-decoration:none;border:1px solid var(--edge);border-radius:20px;padding:4px 14px}.howto:hover{box-shadow:var(--neon)}

/* ===== Responsive: desktop · tablet · phone ===== */

}

/* ===== Drag & drop ===== */
.grip{cursor:grab;color:var(--mut);opacity:.45;font-size:12px;letter-spacing:-2px;padding:0 4px 0 0;user-select:none;touch-action:none;flex:none}
.grip:hover{opacity:1;color:var(--gold)}
.ckitem span.grip,.att span.grip,.file span.grip{flex:0 0 auto}
.ckitem:hover .grip,.file:hover .grip,.att:hover .grip,.ckhead:hover .grip{opacity:.9}
.ckhead b{cursor:grab}
.ckitem.ghost,.file.ghost,.att.ghost,.ck.ghost{opacity:.35;outline:1px dashed var(--gold)}
.dropping{outline:2px dashed var(--gold)!important;outline-offset:3px;box-shadow:0 0 0 6px rgba(240,197,82,.12),var(--neon)!important}
.list.dropping{background-color:rgba(240,197,82,.08)}
.sheet.dropping{outline-offset:-6px}
#dropHint{position:fixed;z-index:200;pointer-events:none;padding:7px 12px;border-radius:8px;background:rgba(10,10,12,.94);color:#f0c552;border:1px solid #6b5520;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dropHint.on{opacity:1;transform:none}
.dz{font-size:11.5px;font-weight:400;color:var(--mut)}
@media (hover:none){.dz{display:none}.grip{opacity:.7}}

.scorebox{border:1px solid var(--edge);border-radius:8px;padding:9px 11px;background:linear-gradient(90deg,rgba(212,167,44,.10),transparent);font-size:13px}

.badge.imp{color:#c4b5fd;background:rgba(168,85,247,.16);font-weight:700}

/* column status + colour */

<script>
/* ===== CONFIG: วาง URL ของ Apps Script Web App ตรงนี้ (หรือใส่ผ่าน ⚙️ ขั้นสูง) ===== */
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbwKGxHAZ2inWEdPmK7eY7GvLL5cE_CN7kzVWKxXFeHL8X63Vu4Afg1bH4dokXhcTDmQsw/exec' };

const T = { mrows:'tb_members', boards:'tb_boards', lists:'tb_lists', cards:'tb_cards', activity:'tb_activity', kudos:'tb_kudos' };
const KEYS = Object.keys(T);
const LS_DATA='tesrboard_demo_v2', LS_CFG='tesrboard_cfg', LS_SES='tesrboard_session', LS_BOARD='tesrboard_board', LS_THEME='tesrboard_theme';
const PALETTE=['#d71f33','#d4a72c','#2fbf71','#3b82f6','#a855f7','#ec4899','#14b8a6','#f97316','#64748b','#84cc16'];
const PRIO={low:'ต่ำ',normal:'ปกติ',high:'สูง',urgent:'ด่วนมาก'};
/* ===== KPI POINTS (ปรับตัวเลขได้ตรงนี้) ===== */
const SIZES={s:{label:'งานทั่วไป',pts:1,icon:'●'},m:{label:'งานกลาง',pts:3,icon:'◆'},l:{label:'โปรเจกต์ / งานใหญ่-ยาก',pts:5,icon:'⭐'}};
const SCORE={solo:1.0, team:0.6, onTime:1.0, late:0.5, initiator:1};  // เดี่ยว 100% · ทีม คนละ 60% · ส่งช้า ×0.5 · ผู้ริเริ่ม +1
/* หมวดผลงาน: งานที่ช่วยให้บริษัทก้าวไปข้างหน้าได้ตัวคูณพิเศษ */
const IMPACT={
  op:  {label:'งานประจำ / Operation',icon:'🔧',mult:1,  hint:'เสนอราคา, จัดส่ง, งานบริการ, งานเอกสาร'},
  rd:  {label:'พัฒนาผลิตภัณฑ์ / R&D',icon:'🧪',mult:1.5,hint:'อัปเกรด Iron-X, ปรับปรุงสินค้า/คอร์สเดิม'},
  new: {label:'ริเริ่มผลิตภัณฑ์ / ไอเดียใหม่',icon:'💡',mult:2,hint:'สินค้าใหม่, คอร์สใหม่, บริการใหม่'},
  grow:{label:'พัฒนาองค์กร / ขยายธุรกิจ',icon:'📈',mult:2,hint:'ใบรับรอง/มาตรฐาน, BOI, Marketplace ใหม่, ตลาด/พาร์ทเนอร์ใหม่'},
  teach:{label:'ถ่ายทอดความรู้',icon:'📚',mult:1.5,hint:'เขียนคู่มือ/README, อัดคลิปสอน, สอนน้องฝึกงาน, ทำเอกสารวงจร'},
  reuse:{label:'ของใช้ซ้ำ / มาตรฐานภายใน',icon:'🛠',mult:1.5,hint:'ไลบรารีโค้ด, แบบ PCB มาตรฐาน, jig, template ที่ทีมใช้ต่อได้'},
  learn:{label:'พัฒนาตัวเอง',icon:'🎓',mult:1.2,hint:'สอบใบรับรอง, เรียนคอร์สจบ (ROS 2, Safety, PLC ...)'}
};
['rd','new','grow'].forEach(k=>IMPACT[k].init=true);            // ได้โบนัสผู้ริเริ่ม
['rd','new','grow','teach','reuse'].forEach(k=>IMPACT[k].dev=true); // นับเป็น "แต้มพัฒนาบริษัท"
SCORE.kudos=0.5;                                   // ได้รับ 🙏 1 ครั้ง = +0.5 แต้ม
const KPI_W={out:0.6,qual:0.2,team:0.2};           // น้ำหนัก KPI Score
const DEFAULT_TARGET=10;                            // เป้าแต้ม/เดือน (Admin ตั้งรายคนได้)
const KUDOS_LIMIT=3;                                // 🙏 ส่งได้กี่ครั้ง/เดือน
const KPI_DEFS=[
  ['🏆','ผลงาน','60%','แต้มจากงานที่ปิดได้ เทียบกับเป้าของคุณ — งานใหญ่/งานพัฒนาบริษัทได้แต้มมากกว่า'],
  ['✅','คุณภาพ','20%','เฉลี่ยจาก: ส่งตรงเวลา · ผ่านรอบแรก (ไม่ถูกตีกลับ) · ไม่เลื่อนกำหนดส่ง'],
  ['🤝','ทีมเวิร์ก','20%','งานที่ทำเป็นทีม + ส่งต่องานให้เพื่อน + 🙏 คำขอบคุณที่ได้รับ (5 ครั้ง = เต็ม)'],
  ['🦺','ความปลอดภัย','เงื่อนไข','ถ้ามีเหตุจากความประมาทในช่วงนั้น จะระงับโบนัส (ไม่หักคะแนน)'],
  ['🚀','พัฒนาบริษัท','ข้อมูลประกอบ','แต้มจากงาน R&D · ไอเดียใหม่ · พัฒนาองค์กร · ถ่ายทอดความรู้ · ของใช้ซ้ำ'],
  ['⭐','ความพอใจลูกค้า','ข้อมูลประกอบ','คะแนน 1–5 ที่ลูกค้าให้ หลังส่งมอบ/ติดตั้ง/อบรม'],
  ['💼','ปิดดีล','ข้อมูลประกอบ','สัดส่วนใบเสนอราคาที่ลูกค้าตอบรับ (สำหรับงานขาย)'],
  ['⏱','Cycle time','ข้อมูลประกอบ','เวลาเฉลี่ยตั้งแต่เริ่มทำจนปิดงาน (วัน)']
];
const PERIODS=[['today','วันนี้'],['7','7 วัน'],['month','เดือนนี้'],['30','30 วัน'],['90','90 วัน'],['365','1 ปี'],['custom','📅 ช่วงวันที่…'],['cmonth','🗓 ช่วงเดือน…']];

let S={staff:[],mrows:[],members:[],boards:[],lists:[],cards:[],activity:[],kudos:[]};
let store, session=null;
const _t0=new Date(),_ym=_t0.toISOString().slice(0,7);
const ui={board:null,view:'board',member:'',search:'',period:'month',scope:'board',openCard:null,dragging:false,from:_ym+'-01',to:_t0.toISOString().slice(0,10),mFrom:_ym,mTo:_ym,hideChecked:false,showActs:true};
const charts=[];

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byPos=(a,b)=>(a.pos||0)-(b.pos||0);
const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fmtD=iso=>iso?new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short'}):'';
const fmtDT=iso=>iso?new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('พื้นที่เก็บในเบราว์เซอร์เต็ม')}}

/* ===== THEME ===== */
function applyTheme(t){document.documentElement.dataset.theme=t;lsSet(LS_THEME,t)}
applyTheme(lsGet(LS_THEME,matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));

/* ===== STORES ===== */
const LocalStore={
  mode:'local',
  async load(){return lsGet(LS_DATA,null)},
  save(){ if(S.activity.length>3000) S.activity=S.activity.slice(-3000); const {members,...rest}=S; lsSet(LS_DATA,rest) },
  async upsert(k,row){const a=S[k];const i=a.findIndex(x=>x.id===row.id);if(i>=0)a[i]=row;else a.push(row);this.save()},
  async upsertMany(k,rows){rows.forEach(r=>{const i=S[k].findIndex(x=>x.id===r.id);if(i>=0)S[k][i]=r;else S[k].push(r)});this.save()},
  async remove(k,id){S[k]=S[k].filter(x=>x.id!==id);this.save()},
  async upload(file){
    if(file.size>1.5e6) throw new Error('โหมดเดโม แนบได้ไม่เกิน 1.5MB ต่อไฟล์');
    const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
    return {url,path:null};
  },
  async removeFile(){},
  async staff(){return S.staff},
  async login(){return null},
  subscribe(){}
};
function makeGasStore(url){
  let q=Promise.resolve(), ver=null, inflight=0;
  async function call(action,body={}){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:session?.token,...body})});
    const j=await r.json();
    if(j.error==='auth'){toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');setTimeout(()=>act('logout'),1500);throw new Error('auth')}
    if(j.error) throw new Error(j.error==='forbidden'?'ไม่มีสิทธิ์ทำรายการนี้':j.error);
    return j;
  }
  function enqueue(fn){inflight++;setSync(true);q=q.then(fn).then(j=>{if(j&&j.ver)ver=j.ver}).catch(e=>{console.error(e);if(e.message!=='auth')toast('บันทึกไม่สำเร็จ: '+e.message)}).finally(()=>{if(--inflight===0)setSync(false)});return q}
  const put=(k,row)=>{const a=S[k];const i=a.findIndex(x=>x.id===row.id);if(i>=0)a[i]=row;else a.push(row)};
  return {
    mode:'sheet',
    async load(){const d=await call('load');ver=d.ver;return {staff:d.staff||[],mrows:d.mrows||[],boards:d.boards||[],lists:d.lists||[],cards:d.cards||[],activity:d.activity||[],kudos:d.kudos||[],_noKudos:!Array.isArray(d.kudos)}},
    async login(user,pass){
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',user,pass})});
      const j=await r.json();
      if(j.error==='invalid') return null;
      if(j.error==='locked') throw new Error('ใส่รหัสผิดหลายครั้ง กรุณารอ 15 นาที');
      if(j.error) throw new Error(j.error);
      return {...j.user,token:j.token};
    },
    async upsert(k,row){put(k,row);enqueue(()=>call('upsert',{table:k,rows:[row]}))},
    async upsertMany(k,rows){rows.forEach(r=>put(k,r));if(rows.length)enqueue(()=>call('upsert',{table:k,rows}))},
    async remove(k,id){S[k]=S[k].filter(x=>x.id!==id);enqueue(()=>call('remove',{table:k,ids:[id]}))},
    async upload(file){
      if(file.size>20e6) throw new Error('ไฟล์ใหญ่เกิน 20MB — แนะนำแปะเป็นลิงก์ Google Drive แทน');
      const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});
      inflight++;setSync(true);
      try{await q; const j=await call('upload',{name:file.name,type:file.type,data});return {url:j.url,path:j.id,thumb:j.thumb}}
      finally{if(--inflight===0)setSync(false)}
    },
    async removeFile(id){if(id)enqueue(()=>call('removeFile',{id}))},
    subscribe(cb){
      const check=async()=>{
        if(!session||document.hidden||ui.dragging||inflight) return;
        try{
          const j=await call('ver'); if(j.ver===ver) return;
          const d=await this.load(); if(inflight||ui.dragging) return;
          Object.assign(S,d); norm(); cb(); saveCache();
        }catch(e){console.warn(e)}
      };
      setInterval(check,30000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
    }
  };
}
function setSync(on,label){const b=$('#modeBadge');if(b&&store?.mode!=='local'){b.textContent=on?(label||'⟳ กำลังบันทึก'):'● Online'}}

/* ===== MEMBERS: พนักงานจาก HR (Time Clock) + ค่าเฉพาะบอร์ด (สี/ฝ่าย/สิทธิ์) ===== */
function buildMembers(){
  const ov=Object.fromEntries(S.mrows.map(r=>[r.id,r]));
  const list=S.staff.map((s,i)=>{const o=ov[s.id]||{};return {
    id:s.id,code:s.code||'',name:s.name||o.name||'?',email:s.email||'',role:s.position||o.role||'',dept:o.dept||'',
    color:o.color||PALETTE[i%PALETTE.length],active:s.active!==false&&o.active!==false,board_role:o.board_role||'member',target:o.target||null}});
  const a=ov.admin;
  if(a||session?.id==='admin') list.unshift({id:'admin',code:'',name:a?.name||session?.name||'Admin',email:a?.email||session?.email||'',role:a?.role||'Admin',dept:a?.dept||'Management',color:a?.color||'#d4a72c',active:true,board_role:'admin'});
  S.members=list;
}
function memberRow(m){return {id:m.id,name:m.name,email:m.email||'',role:m.role||'',dept:m.dept||'',color:m.color||null,active:m.active!==false,board_role:m.board_role||'member',target:m.target?+m.target:null,created_at:S.mrows.find(r=>r.id===m.id)?.created_at||now()}}

/* ===== HELPERS ===== */
function norm(){
  if(!Array.isArray(S.kudos)) S.kudos=[];
  S.cards.forEach(c=>{['assignees','labels','checklists','links','attachments','comments'].forEach(f=>{if(!Array.isArray(c[f]))c[f]=[]})});
  buildMembers();
}
const member=id=>S.members.find(m=>m.id===id);
const card=id=>S.cards.find(c=>c.id===id);
const list=id=>S.lists.find(l=>l.id===id);
const boardLists=b=>S.lists.filter(l=>l.board_id===b).sort(byPos);
const liveCards=()=>S.cards.filter(c=>list(c.list_id));
const isDone=c=>!!list(c.list_id)?.is_done;
const me=()=>member(session?.id)||{id:session?.id,name:session?.name||'?',color:'#d4a72c'};
const isAdmin=()=>session?.role==='admin'||member(session?.id)?.board_role==='admin';
const activeMembers=()=>S.members.filter(m=>m.active!==false);
function initials(n){const w=String(n||'?').trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]/gu,'')||'?';return [...w].slice(0,2).join('').toUpperCase()}
function avatar(m,cls=''){if(!m)return '';return `<span class="av ${cls}" style="background:${m.color||'#555'}" title="${esc(m.name)}">${esc(initials(m.name))}</span>`}
function labelColor(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function ckProgress(c){let t=0,d=0;c.checklists.forEach(cl=>cl.items.forEach(it=>{t++;if(it.done)d++}));return {total:t,done:d}}
function dueInfo(c){
  if(c.kind==='note') return null;
  if(isDone(c)) return {k:'done',cls:'done',text:'✓ '+(c.due?fmtD(c.due):'เสร็จ')};
  if(!c.due) return {k:'none',cls:'none',text:'⚠ ยังไม่ตั้งกำหนดส่ง'};
  const diff=Math.round((new Date(c.due+'T00:00:00')-today())/DAY);
  if(diff<0) return {k:'late',cls:'late',text:`${fmtD(c.due)} · เลย ${-diff} วัน`};
  if(diff<=2) return {k:'soon',cls:'soon',text:`${fmtD(c.due)} · ${diff===0?'วันนี้':'อีก '+diff+' วัน'}`};

function posBetween(el,get){
  const p=el.previousElementSibling,n=el.nextElementSibling;
  const pp=p&&get(p.dataset.id)?.pos,np=n&&get(n.dataset.id)?.pos;
  if(pp!=null&&np!=null)return (pp+np)/2; if(pp!=null)return pp+1024; if(np!=null)return np-1024; return 1024;
}

      await store.upsert('cards',{...c,updated_at:now()}); ok++; last=f.name;
      if(ui.openCard===cardId&&!$('#sheet').contains(document.activeElement)) renderCardModal(); else scheduleRender();
    }catch(err){toast('อัปโหลดไม่สำเร็จ: '+(err.message||err))}

  if(ui.openCard===cardId) renderCardModal(); scheduleRender();

async function addLinks(cardId,urls){

async function dropToList(l,files,urls){

/* ===== Workflow trail & KPI points ===== */
const doneList=bid=>boardLists(bid).find(l=>l.is_done);
function trailOf(c){
  if(Array.isArray(c.trail)&&c.trail.length) return c.trail;
  return [{t:'start',at:c.created_at,by:c.created_by,list:'',to:c.assignees.slice()}];   // การ์ดเก่าที่ยังไม่มีเส้นทาง
}
function contributors(c){
  const s=new Set();
  const boss=id=>id==='admin'||member(id)?.board_role==='admin';
  trailOf(c).forEach(t=>(t.to||[]).forEach(id=>s.add(id)));
  (c.assignees||[]).forEach(id=>s.add(id));
  // คนกดปิดงานนับเป็นผู้มีส่วนร่วม — ยกเว้น Admin/Owner ที่แค่ตรวจรับ (ไม่ได้รับผิดชอบขั้นไหน) จะไม่แย่งแต้มทีม
  const closer=c.done_by||[...trailOf(c)].reverse().find(t=>t.t==='done')?.by;
  if(closer&&(!boss(closer)||s.has(closer))) s.add(closer);
  return [...s].filter(id=>id&&member(id));
}
function cardScore(c){
  // คืนค่า {each, base, mult, team, people[]}  (คิดเฉพาะงานที่เสร็จแล้ว)
  const people=contributors(c), base=SIZES[c.size||'s'].pts, team=people.length>1, imp=IMPACT[c.impact||'op']||IMPACT.op;
  const late=c.due&&c.done_at&&new Date(c.done_at)>new Date(c.due+'T23:59:59');
  const mult=imp.mult*(team?SCORE.team:SCORE.solo)*(late?SCORE.late:SCORE.onTime);
  const starters=imp.init?(trailOf(c)[0]?.to||[]).filter(id=>people.includes(id)):[];
  return {each:Math.round(base*mult*100)/100,base,mult,team,late,people,imp,starters,bonus:SCORE.initiator};
}
const ptsOf=(sc,id)=>sc.people.includes(id)?sc.each+(sc.starters.includes(id)?sc.bonus:0):0;
function pointsFor(id,cards){
  let pts=0,solo=0,team=0,soloN=0,teamN=0,grow=0,growN=0,initN=0;
  cards.forEach(c=>{ if(!isTask(c)||!isDone(c)||!inPeriod(c.done_at)) return;
    const sc=cardScore(c); if(!sc.people.includes(id)) return;
    const v=ptsOf(sc,id); pts+=v; if(sc.team){team+=v;teamN++} else {solo+=v;soloN++}
    if(sc.imp.dev){grow+=v;growN++} if(sc.starters.includes(id)) initN++; });
  const kudosN=(S.kudos||[]).filter(k=>k.type!=='safety'&&k.to===id&&inPeriod(k.at)).length, kudos=kudosN*SCORE.kudos;
  pts+=kudos;
  const r=x=>Math.round(x*10)/10;
  return {pts:r(pts),solo:r(solo),team:r(team),soloN,teamN,grow:r(grow),growN,initN,kudosN,kudos:r(kudos)};
}
const fmtPts=x=>(Math.round(x*10)/10).toLocaleString('th-TH',{maximumFractionDigits:1});
function pushTrail(c,e){c.trail=trailOf(c).slice();c.trail.push({at:now(),by:session.id,...e})}

async function moveCard(c,to,{ask=true,reopen=false}={}){
  const from=list(c.list_id); if(!to||!from) return;
  const sameList=to.id===from.id;
  if(!sameList){ c.list_id=to.id; c.pos=c.pos??Math.max(0,...S.cards.filter(x=>x.list_id===to.id).map(x=>x.pos||0))+1024; applyListChange(c,to) }
  if(sameList){ await saveCard(c); return }
  if(to.is_done){
    c.done_by=session.id; pushTrail(c,{t:'done',list:to.name,list_id:to.id,to:c.assignees.slice()});
    await saveCard(c,`✅ ปิดงาน (ย้ายไป ${to.name})`);
  } else {
    const back=from.is_done||(+to.pos||0)<(+from.pos||0);
    if(from.is_done){c.done_by=null}
    await saveCard(c,back?`↩ ตีกลับจาก ${from.name} → ${to.name}`:`ย้ายการ์ดจาก ${from.name} → ${to.name}`);
    if(ask&&isTask(c)){
      const h=await askHandoff(c,to,back);
      const cc=card(c.id)||c;
      if(h){ const names=h.to.map(id=>member(id)?.name.split(' ')[0]).join(', ')||'-';
        cc.assignees=h.to; pushTrail(cc,{t:back?'back':'handoff',list:to.name,list_id:to.id,to:h.to.slice(),note:h.note||''});
        if(h.note) cc.comments.push({id:uid(),member:session.id,text:`${back?'↩ ตีกลับไป':'🔁 ส่งต่อไป'} ${to.name}: ${h.note}`,at:now()});
        await saveCard(cc,`${back?'↩ ตีกลับไป':'🔁 ส่งต่อไป'} ${to.name} → ${names}`);
      } else { pushTrail(cc,{t:back?'back':'move',list:to.name,list_id:to.id,to:cc.assignees.slice()}); await saveCard(cc) }
    } else if(back&&isTask(c)){ pushTrail(c,{t:'back',list:to.name,list_id:to.id,to:c.assignees.slice()}); await saveCard(c) }
  }
  if(reopen) openCard(c.id);
}
async function toggleDone(c){
  if(!isTask(c)&&!isDone(c)&&!confirm('การ์ดนี้เป็นประเภทข้อมูล/ไฟล์ ต้องการย้ายไปคอลัมน์เสร็จไหม?')) return;
  if(isDone(c)){
    const back=[...trailOf(c)].reverse().find(t=>t.list_id&&!list(t.list_id)?.is_done&&list(t.list_id));
    const to=back?list(back.list_id):boardLists(c.board_id)[0];
    c.done_by=null; pushTrail(c,{t:'reopen',list:to.name,list_id:to.id,to:c.assignees.slice()});
    c.list_id=to.id; applyListChange(c,to); await saveCard(c,`↺ เปิดงานใหม่ (กลับไป ${to.name})`);
  } else {
    const to=doneList(c.board_id); if(!to) return toast('บอร์ดนี้ยังไม่มีคอลัมน์ "เสร็จ" — ตั้งได้ที่ ⋯ ของคอลัมน์');
    c.pos=Math.max(0,...S.cards.filter(x=>x.list_id===to.id).map(x=>x.pos||0))+1024;
    await moveCard(c,to,{ask:false});
    const sc=cardScore(card(c.id)||c); if(isTask(c)) toast(`🏆 ปิดงานแล้ว · ${sc.people.length} คน ได้คนละ ${fmtPts(sc.each)} แต้ม${sc.starters.length?' · ผู้ริเริ่ม +'+sc.bonus:''}`);
  }
  if(ui.openCard===c.id) renderCardModal();
}

function initModalSort(c){
  const opt={animation:150,delay:150,delayOnTouchOnly:true,ghostClass:'ghost',chosenClass:'chosen',onStart:()=>ui.dragging=true};
  const done=async(msg)=>{ui.dragging=false;c.updated_at=now();await store.upsert('cards',c);if(msg)log(c,msg);renderCardModal();scheduleRender()};
  const byIdx=(el,arr)=>[...el.children].map(x=>arr[+x.dataset.i]).filter(Boolean);
  const f=$('#sFiles'); if(f&&c.attachments.length>1) Sortable.create(f,{...opt,handle:'.grip,.file img,.file .ph',onEnd:e=>{if(e.oldIndex===e.newIndex){ui.dragging=false;return}c.attachments=byIdx(f,c.attachments);done('จัดลำดับไฟล์แนบ')}});
  const lk=$('#sLinks'); if(lk&&c.links.length>1) Sortable.create(lk,{...opt,handle:'.grip',onEnd:e=>{if(e.oldIndex===e.newIndex){ui.dragging=false;return}c.links=byIdx(lk,c.links);done()}});
  const cks=$('#sCks'); if(cks&&c.checklists.length>1) Sortable.create(cks,{...opt,handle:'.ckgrip,.ckhead b',draggable:'.ck',onEnd:e=>{if(e.oldIndex===e.newIndex){ui.dragging=false;return}
    const m=Object.fromEntries(c.checklists.map(x=>[x.id,x]));c.checklists=[...cks.querySelectorAll(':scope>.ck')].map(x=>m[x.dataset.cl]).filter(Boolean);done('จัดลำดับเช็คลิสต์')}});
  $$('.ckitems').forEach(el=>Sortable.create(el,{...opt,group:'ckitems-'+c.id,handle:'.igrip,.ckitem>span:not(.grip)',onEnd:e=>{
    if(e.from===e.to&&e.oldIndex===e.newIndex){ui.dragging=false;return}
    const all={},home={};c.checklists.forEach(cl=>cl.items.forEach(it=>{all[it.id]=it;home[it.id]=cl.id}));
    const shown=new Set();
    c.checklists.forEach(cl=>{const box=$(`.ckitems[data-cl="${cl.id}"]`);cl._dom=box?[...box.children].map(x=>x.dataset.it).filter(Boolean):[];cl._dom.forEach(id=>shown.add(id))});
    c.checklists.forEach(cl=>{cl.items=cl._dom.map(id=>all[id]).concat(cl.items.filter(it=>!shown.has(it.id)));delete cl._dom});
    const moved=e.item.dataset.it, to=c.checklists.find(cl=>cl.items.some(it=>it.id===moved));
    done(e.from!==e.to&&all[moved]?`ย้าย "${all[moved].text}" ไปเช็คลิสต์ "${to?.title||''}"`:null)}}));
}

/* ===== PERIOD / STATS ===== */
const MAXSPAN=366*DAY;
function periodRange(){
  const t=today(),end=Date.now()+DAY;
  if(ui.period==='today') return [+t,end];
  if(ui.period==='month'){const d=new Date(t);d.setDate(1);return [+d,end]}
  if(ui.period==='custom'){const a=+new Date(ui.from+'T00:00:00'),b=+new Date(ui.to+'T23:59:59');return [a,b]}
  if(ui.period==='cmonth'){const [y1,m1]=ui.mFrom.split('-').map(Number),[y2,m2]=ui.mTo.split('-').map(Number);return [+new Date(y1,m1-1,1),+new Date(y2,m2,0,23,59,59)]}
  return [Date.now()-(+ui.period)*DAY,end];
}
function periodStart(){return periodRange()[0]}
const inPeriod=iso=>{if(!iso)return false;const t=+new Date(iso),[a,b]=periodRange();return t>=a&&t<=b};
const fmtM=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('th-TH',{month:'short',year:'2-digit'})};
const periodLabel=()=>ui.period==='custom'?`${fmtD(ui.from)} – ${fmtD(ui.to)}`:ui.period==='cmonth'?(ui.mFrom===ui.mTo?fmtM(ui.mFrom):`${fmtM(ui.mFrom)} – ${fmtM(ui.mTo)}`):((PERIODS.find(p=>p[0]===String(ui.period))||[])[1]||'');
function clampRange(){
  // จำกัดช่วงสูงสุด 1 ปี และ from <= to
  if(ui.period==='custom'){
    if(ui.to<ui.from)[ui.from,ui.to]=[ui.to,ui.from];
    const a=new Date(ui.from+'T00:00:00'),b=new Date(ui.to+'T00:00:00');
    if(b-a>=MAXSPAN){const nb=new Date(+a+365*DAY);ui.to=nb.getFullYear()+'-'+String(nb.getMonth()+1).padStart(2,'0')+'-'+String(nb.getDate()).padStart(2,'0');toast('เลือกได้สูงสุด 1 ปี — ปรับวันสิ้นสุดให้แล้ว')}
  }
  if(ui.period==='cmonth'){
    if(ui.mTo<ui.mFrom)[ui.mFrom,ui.mTo]=[ui.mTo,ui.mFrom];
    const [y1,m1]=ui.mFrom.split('-').map(Number),[y2,m2]=ui.mTo.split('-').map(Number);
    if((y2-y1)*12+(m2-m1)>11){const d=new Date(y1,m1-1+11,1);ui.mTo=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');toast('เลือกได้สูงสุด 12 เดือน — ปรับเดือนสิ้นสุดให้แล้ว')}
  }
}
function scopeCards(){return liveCards().filter(c=>ui.scope==='all'||c.board_id===ui.board)}
function scopeBar(title,extra=''){
  const rng=ui.period==='custom'?`<span class="rng"><input type="date" id="pFrom" value="${ui.from}"><span>–</span><input type="date" id="pTo" value="${ui.to}"></span>`
    :ui.period==='cmonth'?`<span class="rng"><input type="month" id="pMFrom" value="${ui.mFrom}"><span>–</span><input type="month" id="pMTo" value="${ui.mTo}"></span>`:'';
  return `<div class="toolbar"><h2>${title}</h2>${extra}
    <select id="scopeSel"><option value="board" ${ui.scope==='board'?'selected':''}>บอร์ดนี้</option><option value="all" ${ui.scope==='all'?'selected':''}>ทุกบอร์ด</option></select>
    <select id="periodSel">${PERIODS.map(([v,t])=>`<option value="${v}" ${String(ui.period)===v?'selected':''}>${t}</option>`).join('')}</select>${rng}</div>`;
}
function bindScope(){
  $('#scopeSel').onchange=e=>{ui.scope=e.target.value;renderMain()};
  $('#periodSel').onchange=e=>{ui.period=e.target.value;clampRange();renderMain()};
  const on=(id,k)=>{const el=$('#'+id);if(el)el.onchange=e=>{if(!e.target.value)return;ui[k]=e.target.value;clampRange();renderMain()}};
  on('pFrom','from');on('pTo','to');on('pMFrom','mFrom');on('pMTo','mTo');
}
const reworked=c=>trailOf(c).some(t=>t.t==='back'||t.t==='reopen');
const pct=(n,d)=>d?Math.round(n/d*100):null;
function qualityOf(doneP,id){
  const wd=doneP.filter(c=>c.due);
  const onTime=pct(wd.filter(c=>new Date(c.done_at)<=new Date(c.due+'T23:59:59')).length,wd.length);
  const firstPass=pct(doneP.filter(c=>!reworked(c)).length,doneP.length);
  const noSlip=pct(doneP.filter(c=>!(c.slips>0)).length,doneP.length);
  const parts=[onTime,firstPass,noSlip].filter(v=>v!=null);
  const cs=doneP.filter(c=>c.csat).map(c=>+c.csat);
  const won=doneP.filter(c=>c.deal==='won').length, lost=doneP.filter(c=>c.deal==='lost').length;
  const safety=id==null?[]:(S.kudos||[]).filter(k=>k.type==='safety'&&k.to===id&&inPeriod(k.at));
  return {firstPass,noSlip,quality:parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):null,
    csat:cs.length?Math.round(cs.reduce((a,b)=>a+b,0)/cs.length*10)/10:null,csatN:cs.length,won,lost,winRate:pct(won,won+lost),safety,reworkN:doneP.filter(reworked).length};
}
function periodDays(){const [a,b]=periodRange();return Math.max(1,(Math.min(b,Date.now())-a)/DAY)}
function kpiOf(s,id){
  const m=member(id), target=Math.max(1,Math.round((+(m?.target)||DEFAULT_TARGET)*periodDays()/30.4*10)/10);
  const out=Math.min(100,Math.round(s.P.pts/target*100));
  const qual=s.quality??0;
  const teamRaw=s.P.teamN+s.handoffs+s.P.kudosN, team=Math.min(100,teamRaw*20);
  const score=Math.round(out*KPI_W.out+qual*KPI_W.qual+team*KPI_W.team);
  const grade=score>=85?'A':score>=70?'B':score>=50?'C':'D';
  return {target,out,qual,team,teamRaw,score,grade,safe:!s.safety.length};
}
function memberStats(id,cards){
  const mine=cards.filter(c=>isTask(c)&&(id===null?!c.assignees.length:c.assignees.includes(id)));
  const open=mine.filter(c=>!isDone(c));
  const firstIds=new Set(S.boards.map(b=>boardLists(b.id)[0]?.id));
  const doing=open.filter(c=>!firstIds.has(c.list_id)), todo=open.filter(c=>firstIds.has(c.list_id));
  const ps=periodStart();
  const contrib=id===null?mine:cards.filter(c=>isTask(c)&&contributors(c).includes(id));
  const doneP=contrib.filter(c=>isDone(c)&&inPeriod(c.done_at));
  const P=id===null?{pts:0,solo:0,team:0,soloN:0,teamN:0,grow:0,growN:0,initN:0,kudosN:0,kudos:0}:pointsFor(id,cards);
  const handoffs=id===null?0:cards.reduce((n,c)=>n+trailOf(c).filter(t=>t.t==='handoff'&&t.by===id&&inPeriod(t.at)).length,0);
  const withDue=doneP.filter(c=>c.due);
  const onTime=withDue.filter(c=>new Date(c.done_at)<=new Date(c.due+'T23:59:59')).length;
  const cyc=doneP.filter(c=>c.started_at).map(c=>(new Date(c.done_at)-new Date(c.started_at))/DAY);
  let ckD=0,ckT=0;open.forEach(c=>{const p=ckProgress(c);ckD+=p.done;ckT+=p.total});
  const closed=doneP.length+open.length;
  const dd={ok:0,soon:0,late:0,none:0};open.forEach(c=>{const d=dueInfo(c);if(d&&dd[d.k]!=null)dd[d.k]++});
  return {mine,open,doing,todo,doneP,overdue:open.filter(isOverdue),
    onTime:withDue.length?Math.round(onTime/withDue.length*100):null,
    cycle:cyc.length?cyc.reduce((a,b)=>a+b,0)/cyc.length:null,
    progress:ckT?Math.round(ckD/ckT*100):null,
    success:closed?Math.round(doneP.length/closed*100):null,dd,P,handoffs,...qualityOf(doneP,id)};
}

function stageTimes(cards){
  const acc={};
  cards.filter(c=>isTask(c)&&isDone(c)&&inPeriod(c.done_at)&&Array.isArray(c.trail)).forEach(c=>{
    const t=c.trail.filter(x=>x.list); for(let i=0;i<t.length-1;i++){ if(t[i].t==='done') continue;
      const d=(new Date(t[i+1].at)-new Date(t[i].at))/DAY; if(d<0) continue;
      (acc[t[i].list]=acc[t[i].list]||[]).push(d) } });
  return Object.entries(acc).map(([k,v])=>[k,Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10,v.length]).sort((a,b)=>b[1]-a[1]);
}

        <label style="display:flex;gap:8px;align-items:center">สถานะคอลัมน์ <select id="lStat">${Object.entries(LSTAT).map(([k,v])=>`<option value="${k}" ${k===lstat(l)?'selected':''}>${v.i||'⚪'} ${v.t}${k==='done'?' — นับเป็นผลงาน':''}</option>`).join('')}</select></label>
        <div class="muted" style="font-size:12px;margin-top:6px">💡 คลิกป้ายสถานะบนหัวคอลัมน์เพื่อเปลี่ยนสถานะ/สีได้ทันที</div>
        <div class="mfoot"><button class="danger sm" data-act="delList" data-id="${l.id}">ลบลิสต์</button><button class="pri" data-act="saveList" data-id="${l.id}">บันทึก</button></div>`;showModal();break}
    case 'saveList':{const l=list(d.id);l.name=$('#lName').value.trim()||l.name;l.status=$('#lStat').value;l.is_done=l.status==='done';await store.upsert('lists',l);closeModal();scheduleRender();break}
    case 'delList':{const l=list(d.id),n=S.cards.filter(x=>x.list_id===l.id);if(!confirm(`ลบลิสต์ "${l.name}"${n.length?` และการ์ด ${n.length} ใบ`:''}?`))return;
      for(const x of n)await store.remove('cards',x.id);await store.remove('lists',l.id);closeModal();scheduleRender();break}
    case 'toggleAssignee':{const i=c.assignees.indexOf(d.id);i>=0?c.assignees.splice(i,1):c.assignees.push(d.id);await saveCard(c,(i>=0?'เอาออก ':'มอบหมายให้ ')+member(d.id).name);renderCardModal();break}
    case 'addChecklist':{const t=prompt('ชื่อเช็คลิสต์','เช็คลิสต์');if(!t)return;c.checklists.push({id:uid(),title:t,items:[]});await saveCard(c,'เพิ่มเช็คลิสต์ "'+t+'"');renderCardModal();break}
    case 'delChecklist':{if(!confirm('ลบเช็คลิสต์นี้?'))return;c.checklists=c.checklists.filter(x=>x.id!==d.cl);await saveCard(c);renderCardModal();break}
    case 'addItem':{const inp=$(`[data-additem="${d.cl}"]`),t=inp.value.trim();if(!t)return;c.checklists.find(x=>x.id===d.cl).items.push({id:uid(),text:t,done:false,assignee:null,due:null});await saveCard(c);renderCardModal();$(`[data-additem="${d.cl}"]`)?.focus();break}
    case 'toggleItem':{const it=c.checklists.find(x=>x.id===d.cl).items.find(x=>x.id===d.it);it.done=!it.done;it.done_at=it.done?now():null;it.by=it.done?session.id:null;await saveCard(c,(it.done?'ทำเสร็จ ':'ยกเลิกติ๊ก ')+'"'+it.text+'"');renderCardModal();break}
    case 'toggleDone': toggleDone(c); break;
    case 'scoreHelp': scoreHelp(); break;
    case 'kpiHelp': kpiHelp(); break;
    case 'howto': openHowto(); break;
    case 'closeHowto': closeHowto(); break;
    case 'kudos': kudosModal(d.id); break;
    case 'safetyLog': safetyLog(d.id); break;
    case 'delKudos':{if(!confirm('ลบรายการนี้?'))return;await store.remove('kudos',d.id);renderMain();break}
    case 'toggleHideChecked': ui.hideChecked=!ui.hideChecked; renderCardModal(); break;
    case 'toggleActs': ui.showActs=!ui.showActs; renderCardModal(); break;
    case 'replyCmt':{const t=$('#cmt');t.value='@'+d.name+' ';t.focus();break}
    case 'delCmt':{if(!confirm('ลบคอมเมนต์นี้?'))return;c.comments=c.comments.filter(x=>x.id!==d.id);await saveCard(c);renderCardModal();break}
    case 'delItem':{const cl=c.checklists.find(x=>x.id===d.cl);cl.items=cl.items.filter(x=>x.id!==d.it);await saveCard(c);renderCardModal();break}
    case 'addLink':{let u=$('#lnkUrl').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;const tt=$('#lnkTitle').value.trim();c.links.push({url:u,title:tt,at:now(),by:session.id});await saveCard(c,'แนบลิงก์ '+(tt||u));renderCardModal();break}
    case 'delLink': c.links.splice(+d.i,1);await saveCard(c);renderCardModal();break;
    case 'delAtt':{if(!confirm('ลบไฟล์แนบ?'))return;const [x]=c.attachments.splice(+d.i,1);await store.removeFile(x?.path);await saveCard(c,'ลบไฟล์ '+(x?.name||''));renderCardModal();break}
    case 'addComment':{const t=$('#cmt').value.trim();if(!t)return;c.comments.push({id:uid(),member:session.id,text:t,at:now()});await saveCard(c);renderCardModal();break}
    case 'deleteCard':{if(!canDeleteCard(c)||!confirm('ลบการ์ดนี้?'))return;for(const x of c.attachments)await store.removeFile(x.path);await store.remove('cards',c.id);log(null,`ลบงาน "${c.title}"`);closeModal();scheduleRender();break}
    case 'toggleActive':{const x=member(d.id);x.active=x.active===false;await store.upsert('mrows',memberRow(x));buildMembers();renderSettings();scheduleRender();break}
    case 'saveCfg':{lsSet(LS_CFG,{url:$('#apiUrl').value.trim()});localStorage.removeItem(LS_SES);location.reload();break}
    case 'clearCfg':{localStorage.removeItem(LS_CFG);location.reload();break}
    case 'exportAll':{const {members,...data}=S;const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download=`tesr-board-${new Date().toISOString().slice(0,10)}.json`;a2.click();break}
    case 'resetDemo':{if(!confirm('ล้างข้อมูลเดโมทั้งหมดในเครื่องนี้?'))return;localStorage.removeItem(LS_DATA);localStorage.removeItem(LS_SES);location.reload();break}
  }
}
/* ----- ลากไฟล์/ลิงก์จากภายนอกมาวาง: การ์ด · ลิสต์ · หน้าการ์ดที่เปิดอยู่ ----- */
(function(){
  const hint=document.createElement('div');hint.id='dropHint';document.body.appendChild(hint);
  let localDrag=false,lastEl=null;
  document.addEventListener('dragstart',()=>localDrag=true,true);
  document.addEventListener('dragend',()=>{localDrag=false;clear()},true);
  const ext=e=>{if(localDrag||!session)return false;const t=[...(e.dataTransfer?.types||[])];return t.includes('Files')||t.includes('text/uri-list')};
  const target=e=>{
    const el=e.target&&e.target.closest?e.target:e.target?.parentElement; if(!el) return null;
    if(ui.openCard&&el.closest('#modal')) return {t:'modal',el:$('#sheet'),id:ui.openCard,label:'📎 วางเพื่อแนบเข้าการ์ดนี้'};
    if(!$('#modal').classList.contains('hidden')) return null;
    const cd=el.closest('.card[data-id]'); if(cd){const c=card(cd.dataset.id);return c&&{t:'card',el:cd,id:c.id,label:'📎 แนบเข้า: '+c.title}}
    const ls=el.closest('.list[data-id]'); if(ls){const l=list(ls.dataset.id);return l&&{t:'list',el:ls,id:l.id,label:'➕ สร้างการ์ดใหม่ใน: '+l.name}}
    return null;
  };
  function clear(){if(lastEl)lastEl.classList.remove('dropping');lastEl=null;hint.classList.remove('on')}
  document.addEventListener('dragover',e=>{
    if(!ext(e))return; e.preventDefault();
    const d=target(e); e.dataTransfer.dropEffect=d?'copy':'none';
    if(!d){clear();return}
    if(lastEl!==d.el){clear();lastEl=d.el;d.el.classList.add('dropping')}
    hint.textContent=d.label;hint.classList.add('on');
    hint.style.left=Math.min(e.clientX+16,innerWidth-hint.offsetWidth-8)+'px';hint.style.top=(e.clientY+18)+'px';
  });
  document.addEventListener('dragleave',e=>{if(!e.relatedTarget)clear()});
  document.addEventListener('drop',async e=>{
    if(!ext(e))return; e.preventDefault();
    const d=target(e); clear(); if(!d) return;
    const files=[...(e.dataTransfer.files||[])];
    const urls=files.length?[]:(e.dataTransfer.getData('text/uri-list')||'').split(/\r?\n/).map(x=>x.trim()).filter(x=>/^https?:\/\//i.test(x));
    if(!files.length&&!urls.length) return;
    if(d.t==='list') return dropToList(list(d.id),files,urls);
    if(urls.length) return addLinks(d.id,urls);
    uploadFiles(d.id,files);
  });
  document.addEventListener('paste',e=>{
    if(!ui.openCard||$('#modal').classList.contains('hidden'))return;
    const files=[...(e.clipboardData?.files||[])]; if(!files.length)return;
    e.preventDefault();
    uploadFiles(ui.openCard,files.map((f,i)=>f.name&&f.name!=='image.png'?f:new File([f],`pasted-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}${i?'-'+i:''}.${(f.type.split('/')[1]||'png')}`,{type:f.type})));
  });
})();
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){e.preventDefault()}
  act(el.dataset.act,el.dataset);
});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal()});
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){ui.view=b.dataset.v;renderMain()}};
$('#boardSel').onchange=e=>{ui.board=e.target.value;lsSet(LS_BOARD,ui.board);renderMain()};
$('#memberFilter').onchange=e=>{ui.member=e.target.value;renderMain()};
$('#search').oninput=e=>{ui.search=e.target.value.trim();renderMain()};
$('#whoBtn').onclick=renderSettings;
$('#boardMenu').onclick=async()=>{
  if(!isAdmin())return;
  const b=S.boards.find(x=>x.id===ui.board);
  const ch=prompt(`บอร์ด "${b.name}"\n1 = สร้างบอร์ดใหม่\n2 = เปลี่ยนชื่อบอร์ดนี้\n3 = ลบบอร์ดนี้`,'1');
  if(ch==='1'){const n=prompt('ชื่อบอร์ดใหม่');if(n?.trim()){const nb=await createBoard(n.trim());ui.board=nb.id;lsSet(LS_BOARD,nb.id);renderMain()}}
  else if(ch==='2'){const n=prompt('ชื่อใหม่',b.name);if(n?.trim()){b.name=n.trim();await store.upsert('boards',b);renderMain()}}
  else if(ch==='3'){if(S.boards.length<2)return toast('ต้องมีอย่างน้อย 1 บอร์ด');if(!confirm(`ลบบอร์ด "${b.name}" และงานทั้งหมดในบอร์ด?`))return;
    for(const c of S.cards.filter(c=>c.board_id===b.id))await store.remove('cards',c.id);for(const l of boardLists(b.id))await store.remove('lists',l.id);await store.remove('boards',b.id);ui.board=S.boards[0].id;renderMain()}
};

/* ===== LOGIN & BOOT ===== */
function showLogin(msg=''){ $('#login').classList.remove('hidden');$('#topbar').classList.add('hidden');$('#main').innerHTML='';$('#lErr').textContent=msg; }
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();if(store.mode==='local'){$('#lErr').textContent='ยังไม่ได้เชื่อมต่อ API — กดทดลองโหมดเดโมด้านล่าง';$('#demoBtn').classList.remove('hidden');return}const btn=$('#lBtn');btn.disabled=true;btn.textContent='กำลังตรวจสอบ...';$('#lErr').textContent='';
  try{
    const u=await store.login($('#lUser').value.trim(),$('#lPass').value.trim());
    if(!u){$('#lErr').textContent='อีเมลหรือเบอร์โทรไม่ถูกต้อง';return}
    session={...u,at:Date.now()};lsSet(LS_SES,session);await enterApp();
  }catch(err){console.error(err);$('#lErr').textContent=(store.mode==='local'?'ยังไม่ได้เชื่อมต่อ API':'เข้าสู่ระบบไม่ได้: '+(err.message||err));$('#demoBtn').classList.remove('hidden')}
  finally{btn.disabled=false;btn.textContent='เข้าสู่ระบบ'}
};
async function startDemo(){
  store=LocalStore;const d=await store.load();if(d&&d.boards?.length)Object.assign(S,d);else seedDemo();
  session={id:'admin',name:'Admin (Demo)',email:'admin@demo.tesr',role:'admin',demo:true,at:Date.now()};lsSet(LS_SES,session);
  await enterApp();
}
const LS_CACHE='tesrboard_cache_v1';
let _cacheT=0;
function saveCache(){ if(store?.mode==='local'||!session) return; clearTimeout(_cacheT);
  _cacheT=setTimeout(()=>{try{const {members,...data}=S;localStorage.setItem(LS_CACHE,JSON.stringify({user:session.id,at:Date.now(),data}))}catch(e){}},1500) }
async function enterApp(){
  if(store.mode!=='local'){
    const c=lsGet(LS_CACHE,null);
    if(c&&c.user===session.id&&c.data&&Array.isArray(c.data.boards)&&c.data.boards.length){
      // เปิดทันทีจากข้อมูลล่าสุดในเครื่อง แล้วค่อยซิงค์กับเซิร์ฟเวอร์เบื้องหลัง
      Object.assign(S,c.data); norm();
      const saved=lsGet(LS_BOARD,'');ui.board=S.boards.some(b=>b.id===saved)?saved:S.boards.sort(byPos)[0].id;
      $('#login').classList.add('hidden');$('#topbar').classList.remove('hidden'); renderMain(); setSync(true,'⟳ กำลังซิงค์');
      try{ const d=await store.load(); Object.assign(S,d); }finally{ setSync(false) }
    } else Object.assign(S,await store.load());
  }
  norm();
  if(store.mode!=='local'&&session.id==='admin'&&!S.mrows.some(r=>r.id==='admin')){
    await store.upsert('mrows',{id:'admin',name:session.name||'Anon',email:session.email||'',role:'CEO · Owner',dept:'Management',color:'#d4a72c',active:true,board_role:'admin',created_at:now()});norm();
  }
  if(!S.boards.length) await createBoard('TESR งานหลัก');
  const saved=lsGet(LS_BOARD,'');ui.board=S.boards.some(b=>b.id===saved)?saved:S.boards.sort(byPos)[0].id;
  // refresh role from latest board settings
  const mm=member(session.id);if(mm&&session.id!=='admin'){session.role=mm.board_role||'member';lsSet(LS_SES,session)}
  store.subscribe(()=>scheduleRender());
  $('#login').classList.add('hidden');$('#topbar').classList.remove('hidden');
  renderMain();
}
(async function boot(){
  const cfg=getCfg();
  store=cfg.url?makeGasStore(cfg.url):LocalStore;
  if(store===LocalStore){$('#demoBtn').classList.remove('hidden');$('#lErr').textContent='ยังไม่ได้เชื่อมต่อ API — ทดลองโหมดเดโมได้'}
  const s=lsGet(LS_SES,null);
  if(s&&Date.now()-s.at<30*DAY){
    session=s;
    try{
      if(s.demo){await startDemo();return}
      if(store.mode==='local') throw new Error('offline');
      await enterApp();return;
    }catch(e){console.error(e);session=null;localStorage.removeItem(LS_SES);showLogin('กรุณาเข้าสู่ระบบอีกครั้ง');$('#demoBtn').classList.remove('hidden');return}
  }
  showLogin();
})();
</script>
